{# Friendly line illustrations for empty states. Usage: {% include "includes/illus.html" with kind="tasks" %} #}
<svg class="illus" viewBox="0 0 180 130" fill="none" aria-hidden="true" focusable="false">
  <ellipse cx="90" cy="118" rx="62" ry="6" fill="var(--surface-2)"/>
  {% if kind == "tasks" %}
    <circle cx="136" cy="30" r="13" fill="var(--accent)"/>
    <g stroke="var(--accent)" stroke-width="3" stroke-linecap="round"><path d="M136 8v4M136 48v4M114 30h4M154 30h4M120 14l3 3M149 43l3 3M152 14l-3 3M123 43l-3 3"/></g>
    <rect x="34" y="28" width="86" height="86" rx="14" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="2"/>
    <circle cx="54" cy="52" r="8" fill="var(--primary)"/><path d="m50.5 52 2.6 2.6 5-5.2" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="48" width="36" height="7" rx="3.5" fill="var(--line-strong)"/>
    <circle cx="54" cy="76" r="8" stroke="var(--line-strong)" stroke-width="2.4" stroke-dasharray="4 3"/>
    <rect x="70" y="72" width="28" height="7" rx="3.5" fill="var(--line)"/>
    <circle cx="54" cy="100" r="8" stroke="var(--line-strong)" stroke-width="2.4" stroke-dasharray="4 3"/>
    <rect x="70" y="96" width="34" height="7" rx="3.5" fill="var(--line)"/>
  {% elif kind == "goals" %}
    <path d="M30 112 70 52l22 30 18-22 40 52Z" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M70 52V26" stroke="var(--ink-2)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M70 26h26l-5 8 5 8H70Z" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="140" cy="34" r="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.4"/>
  {% elif kind == "habits" %}
    <circle cx="90" cy="62" r="40" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="2"/>
    <path d="M62 56a30 30 0 0 1 52-14" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/><path d="m116 30-2 14-14-3" stroke="var(--primary)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 68a30 30 0 0 1-52 14" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/><path d="m64 94 2-14 14 3" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="62" r="6" fill="var(--primary-soft)"/>
  {% elif kind == "search" %}
    <circle cx="82" cy="54" r="30" fill="var(--surface)" stroke="var(--primary)" stroke-width="5"/>
    <path d="m104 76 22 22" stroke="var(--primary)" stroke-width="7" stroke-linecap="round"/>
    <path d="M68 54h28M72 44h20" stroke="var(--line-strong)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="140" cy="28" r="6" fill="var(--accent)"/>
  {% elif kind == "done" %}
    <circle cx="90" cy="60" r="38" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="3"/>
    <path d="m72 61 13 13 24-26" stroke="var(--ok)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="var(--accent)"><circle cx="38" cy="30" r="4"/><circle cx="148" cy="40" r="5"/><circle cx="46" cy="96" r="3.5"/></g>
    <g fill="var(--primary)"><circle cx="146" cy="92" r="4"/><circle cx="30" cy="62" r="3"/></g>
  {% elif kind == "offline" %}
    <path d="M40 84a50 50 0 0 1 100 0" stroke="var(--line-strong)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
    <path d="M58 90a32 32 0 0 1 64 0" stroke="var(--line-strong)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
    <circle cx="90" cy="100" r="7" fill="var(--accent)"/>
    <path d="M64 30 116 82" stroke="var(--danger)" stroke-width="5" stroke-linecap="round"/>
  {% endif %}
</svg>
