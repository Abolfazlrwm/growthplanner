<div id="review-panel" class="mt-3">
  {% if tasks %}
    <ul class="task-list">
      {% for task in tasks %}{% include "tasks/_task_row.html" %}{% endfor %}
    </ul>
  {% else %}
    <div class="empty">
      {% include "includes/illus.html" with kind="done" %}
      <h3>همه‌چیز مرتب است</h3>
      <p>تسک باز و ناتمامی برای امروز نمانده.</p>
    </div>
  {% endif %}
</div>
