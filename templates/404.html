<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>صفحه پیدا نشد · رشد شخصی</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    :root{--bg:#eef3f4;--ink:#12262b;--ink2:#4b6269;--primary:#0b7a84;--pink:#fff}
    @media (prefers-color-scheme:dark){:root{--bg:#0b1a1d;--ink:#e6f1f2;--ink2:#a5bcc0;--primary:#4cc3cc;--pink:#06262a}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;text-align:center;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;line-height:1.8}
    .code{font-size:5rem;font-weight:800;line-height:1;color:var(--primary)}
    h1{font-size:1.4rem;margin:.6rem 0 .25rem}
    p{margin:0 0 1.4rem;color:var(--ink2)}
    a{display:inline-block;padding:.7rem 1.5rem;border-radius:11px;background:var(--primary);color:var(--pink);font-weight:700;text-decoration:none}
    a:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">۴۰۴</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>لینک اشتباه است یا صفحه حذف شده.</p>
    <a href="/">برگشت به صفحه‌ی اصلی</a>
  </main>
</body>
</html>
