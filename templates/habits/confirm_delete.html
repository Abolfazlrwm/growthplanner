{% extends "base.html" %}

{% block title %}حذف عادت{% endblock %}

{% block content %}
  <div class="auth">
    <div class="card auth-card text-center">
      <div class="status-icon danger"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg></div>
      <h1 style="font-size:1.2rem">حذف عادتِ «{{ object.title }}»؟</h1>
      <p class="muted mt-2 text-sm">تسک‌هایی که قبلاً از این عادت ساخته شده‌اند حذف نمی‌شوند.</p>
      <form method="post" class="row mt-4" style="gap:.6rem">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger grow">بله، حذف شود</button>
        <a href="{% url 'habits:list' %}" class="btn btn-ghost grow">انصراف</a>
      </form>
    </div>
  </div>
{% endblock %}
