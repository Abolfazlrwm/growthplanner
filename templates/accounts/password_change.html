{% extends "base.html" %}

{% block title %}تغییر رمز عبور{% endblock %}

{% block content %}
  <div class="auth">
    <div class="card auth-card">
      <h1 class="mb-4">تغییر رمز عبور</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="row" style="gap:.6rem">
          <button type="submit" class="btn btn-primary grow">ثبت رمز جدید</button>
          <a href="{% url 'accounts:settings' %}" class="btn btn-ghost">انصراف</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
